name = "scandeals-ai"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Komma-getrennte Liste erlaubter Origins (exakter Vergleich, ohne Slash am Ende)
ALLOWED_ORIGINS = "https://ysfbzn0301.github.io,http://localhost:8080"
MODEL = "claude-opus-5-5"

# Tagespreise (Open Price Engine). Secret setzen mit: npx wrangler secret put OPE_API_KEY
# Läden als JSON-String. Die Kürzel (slug) per /prices/stores prüfen und anpassen.
OPE_STORES = '[{"slug":"aldi_sud","name":"Aldi Süd"},{"slug":"lidl","name":"Lidl"},{"slug":"globus","name":"Globus"},{"slug":"alnatura","name":"Alnatura"}]'
# Optional: OPE_BASE = "https://openpricengine.com/api/v1"
# Optional: OPE_DEBUG = "true"  (erlaubt /prices?...&raw=1 mit den rohen Antworten)

# Echtzeitpreise (SerpApi / Google Shopping). Secret setzen mit: npx wrangler secret put SERPAPI_KEY
# Optional: SERP_CACHE_HOURS = "12"   (Cache-Dauer in Stunden, spart Suchen)
# Optional: SERP_LOCATION = "Germany"

# Kontingent-Warnung (SerpApi). Alle optional, Defaults in Klammern.
# Warnung, wenn verbleibende Suchen <= max(SERP_WARN_MIN, SERP_WARN_PERCENT % des Monatskontingents)
# SERP_WARN_PERCENT = "20"   (Standard 20)
# SERP_WARN_MIN = "25"       (Standard 25)
# SERP_RESERVE = "0"         (Suchen, die nie verbraucht werden, z. B. 5 als Puffer; Standard 0)
