<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PreisFuchs – Preisvergleich per Suche &amp; Scan</title>
  <meta name="description" content="PreisFuchs: Preise per Produktsuche oder Barcode-Scan vergleichen.">
  <meta name="theme-color" content="#ff6a00">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="wrap header-row">
      <button id="back" class="icon-btn" type="button" aria-label="Zurück" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="brand" href="#/"><span class="logo" aria-hidden="true">🦊</span> PreisFuchs</a>
    </div>
    <div class="wrap">
      <form id="search-form" class="search" role="search" autocomplete="off">
        <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Produkt oder Barcode eingeben" aria-label="Produktname oder Barcode" autocapitalize="off">
        <button class="btn primary" type="submit">Suchen</button>
      </form>
      <button id="scan-btn" class="btn scan" type="button">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
        Barcode scannen
      </button>
    </div>
  </header>

  <div id="offline" class="offline" role="status" hidden>Du bist offline – es werden evtl. nur gespeicherte Daten angezeigt.</div>

  <main id="view" class="wrap" aria-live="polite"></main>

  <footer class="wrap footer">
    Preisdaten: Open Prices / Open Food Facts (Community, ODbL). Preise können abweichen.
  </footer>

  <div id="scanner" class="scanner" role="dialog" aria-modal="true" aria-label="Barcode scannen" hidden>
    <video id="video" muted playsinline></video>
    <div class="frame" aria-hidden="true"><i></i></div>
    <p id="scan-msg" class="scan-msg">Halte den Barcode in den Rahmen</p>
    <button id="scan-cancel" class="btn" type="button">Abbrechen</button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
